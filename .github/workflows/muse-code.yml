# Muse — manual workflow for the Seed Directory (seeds-hues).
#
# Manual-dispatch ONLY: nothing in this repo runs Muse Code automatically.
# A human starts a run from the Actions tab and names the task file to run.
#
# The live app is the Next.js app in `v2/` (the root `app/` is a legacy
# static site). Task prompt files live at the repo root under `muse-tasks/`,
# and the Muse run starts from the repo root; dependencies are installed
# in `v2/` first so Muse can run the app's tests itself.
#
# The Meta API key comes from this repository's Secrets (secrets.META_API_KEY)
# and is passed to the run only as the META_API_KEY environment variable.
# It is never printed, committed, or passed as a command-line flag.
#
# Exit code 0 from `muse exec` means the turn finished — NOT that the work
# is correct. Correctness is gated on this repo's own verification: the
# workflow runs `npm run verify` in `v2/` (lint + typecheck + vitest) after
# the Muse run, and no pull request is created unless that gate passes
# in full.
#
# The run is bounded two ways: the job timeout (60 minutes) and the
# `max_model_steps` input passed to `muse exec`. A headless run cannot
# answer approval prompts, so the run uses `--approval-mode never`.
#
# The Muse bubblewrap sandbox is DISABLED for this run
# (`--disable-sandbox`), deliberately. GitHub-hosted `ubuntu-latest`
# runners are Ubuntu 24.04, which sets
# `kernel.apparmor_restrict_unprivileged_userns=1` by default; under that
# restriction the user namespace bubblewrap creates gets no capabilities,
# so it cannot bring up the sandbox's loopback interface and every
# sandboxed command dies before starting with
# `bwrap: loopback: Failed RTM_NEWADDR: Operation not permitted`.
# Muse fails closed in that state, so with the sandbox on, the
# builder could not execute a single shell command (diagnosed
# 2026-11-20 from run 44876409542's run log: 1 bash attempt, 0 successful
# executions — six admin Slice 0 runs each failed the verify gate on one
# fresh error because the builder wrote code blind and the gate was the
# first real check). Meta's docs sanction `--disable-sandbox` for runs
# inside an already-isolated environment; a GitHub-hosted runner is
# exactly that — an ephemeral, single-use VM holding only this repo and
# the run's environment, discarded when the job ends. Isolation is
# provided by the runner itself; the approval layer is unaffected
# (`--approval-mode never` stands), repo permissions are unchanged, and
# no additional secrets are exposed.

name: Muse

on:
  workflow_dispatch:
    inputs:
      task_file:
        description: "Task prompt file for Muse to run"
        type: string
        required: true
      max_model_steps:
        description: "Maximum model steps for the headless Muse run"
        type: number
        required: true
        default: 100

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: muse-code
  cancel-in-progress: false

jobs:
  muse-task:
    name: Muse task
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - name: Install Muse Code
        run: |
          curl -fsSL https://dev.meta.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/muse" --version

      - name: Install dependencies (so Muse can run the repo's tests itself)
        working-directory: v2
        run: npm ci

      - name: Run the Muse task
        env:
          META_API_KEY: ${{ secrets.META_API_KEY }}
        run: |
          set -o pipefail
          muse exec \
            --prompt-file "${{ inputs.task_file }}" \
            --approval-mode never \
            --disable-sandbox \
            --max-model-steps ${{ inputs.max_model_steps }} \
            --json | tee muse-run.jsonl

      - name: Fail if Muse made no changes
        run: |
          # muse-run.jsonl is a run log, not work product — ignore it here.
          if [ -z "$(git status --porcelain -- . ':(exclude)muse-run.jsonl')" ]; then
            echo "::error::Muse finished but the working tree has no changes. Failing visibly instead of opening an empty PR."
            exit 1
          fi
          git status --porcelain

      - name: Upload the Muse run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muse-run-log
          path: muse-run.jsonl
          if-no-files-found: warn
          retention-days: 14

      - name: Gate on the repo's own tests
        working-directory: v2
        run: npm run verify

      - name: Open a pull request with the changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The run log was already uploaded as an artifact above.
          # Delete it so it can never be committed.
          rm -f muse-run.jsonl

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="muse/${{ github.run_id }}"
          git switch -c "$BRANCH"
          git add -A

          if git diff --cached --quiet; then
            echo "::error::Nothing staged after removing the run log. Refusing to open an empty PR."
            exit 1
          fi

          git commit -m "Muse: $(basename "${{ inputs.task_file }}")"
          git push origin "$BRANCH"

          # The PR title comes from the task file itself: its first H1
          # line ("# ..."), stripped of the "# " prefix. If the task file
          # has no H1, fall back to the file's basename.
          PR_TITLE="$(grep -m 1 '^# ' "${{ inputs.task_file }}" | sed 's/^# //')"
          if [ -z "$PR_TITLE" ]; then
            PR_TITLE="$(basename "${{ inputs.task_file }}")"
          fi

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "$PR_TITLE" \
            --body "This pull request was produced by a manually dispatched \`Muse\` workflow run.

          - Task file used: \`${{ inputs.task_file }}\`
          - Workflow run: ${{ github.run_id }}; the full Muse run log is attached to that workflow run as the \`muse-run-log\` artifact.
          - Gate: \`npm run verify\` in \`v2/\` passed in the workflow before this PR was created — no PR is created when verification fails.
          - Not auto-merged. Hue verifies the change before any merge."
