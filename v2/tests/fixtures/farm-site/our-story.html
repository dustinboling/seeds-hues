<h1>Our story</h1>
<p>Fixture Flower Farm was established in 2014 by two sisters who loved sweet peas.</p>
<p>Everything is grown without synthetic sprays, and we have been certified naturally grown since 2019.</p>
<p>We save seed from our best open-pollinated plants each autumn.</p>
